name: Veritabanı yedeği

on:
  schedule:
    # Her pazar 01:30 UTC = 04:30 Türkiye
    - cron: '30 1 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yedekle:
    runs-on: ubuntu-latest
    steps:
      - name: Şifre tanımlı mı
        env:
          YEDEK_SIFRE: ${{ secrets.YEDEK_SIFRE }}
        run: |
          if [ ${#YEDEK_SIFRE} -lt 16 ]; then
            echo "::error::YEDEK_SIFRE gizli değeri tanımlı değil ya da 16 karakterden kısa. README → Yedekleme bölümüne bakın."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Paketleri kur
        run: npm install --prefix scripts --no-audit --no-fund
      - name: Veritabanını oku
        run: node scripts/yedek.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Şifrele
        env:
          YEDEK_SIFRE: ${{ secrets.YEDEK_SIFRE }}
        run: |
          mkdir cikti
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in yedek.json.gz -out cikti/yedek.json.gz.enc -pass env:YEDEK_SIFRE
          rm yedek.json.gz
          echo "TARIH=$(TZ=Europe/Istanbul date +%Y-%m-%d)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: yedek-${{ env.TARIH }}
          path: cikti/yedek.json.gz.enc
          retention-days: 90
          if-no-files-found: error
