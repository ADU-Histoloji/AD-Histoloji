name: Preparatları derslere bağla

on:
  workflow_dispatch:
    inputs:
      kuru:
        description: 'Kuru deneme: hiçbir şey yazma'
        type: boolean
        default: true

jobs:
  bagla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Paketleri kur
        run: npm install --prefix scripts --no-audit --no-fund
      - name: Bağla
        run: node scripts/preparat-ders.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          KURU: ${{ inputs.kuru }}
