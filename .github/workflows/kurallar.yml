name: Firestore kurallarını yayınla

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - '.github/workflows/kurallar.yml'
  workflow_dispatch:

jobs:
  yayinla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Paketleri kur
        run: npm install --prefix scripts --no-audit --no-fund
      - name: Kuralları yayınla
        run: node scripts/kurallar.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
